apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: eco-matcher-agent
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      serviceAccountName: 610755018887-compute@developer.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: BACKEND_IMAGE
          name: backend
          resources:
            limits: { cpu: "1", memory: "512Mi" }
          # Internal only: no ports section needed here
        - image: FRONTEND_IMAGE
          name: frontend
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: "http://localhost:8000/chat"
          startupProbe:
            timeoutSeconds: 240
            periodSeconds: 10
            failureThreshold: 3
            tcpSocket:
              port: 8080