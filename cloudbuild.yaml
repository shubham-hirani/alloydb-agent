steps:
  # 1. Build Backend (Tag with BOTH SHA and Latest)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:$COMMIT_SHA'
      - '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:latest'
      - '-f', 'backend/Dockerfile', '.'

  # 2. Build Frontend (Tag with BOTH SHA and Latest)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:$COMMIT_SHA'
      - '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:latest'
      - '-f', 'frontend/Dockerfile', '.'

  # 3. Push all tags
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend', '--all-tags']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend', '--all-tags']

  # 4. Replace placeholders and Deploy to us-east1
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|BACKEND_IMAGE|us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:$COMMIT_SHA|g" service.yaml
        sed -i "s|FRONTEND_IMAGE|us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:$COMMIT_SHA|g" service.yaml
        gcloud run services replace service.yaml --region us-east1

options:
  logging: CLOUD_LOGGING_ONLY