steps:
  # 1. Build Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - '.'

  # 2. Build Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:$COMMIT_SHA'
      - '-f'
      - 'frontend/Dockerfile'
      - '.'

  # 3. Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:$COMMIT_SHA']

  # 4. Push Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:$COMMIT_SHA']

  # 5. Update and Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        sed -i "s|BACKEND_IMAGE|us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/backend:$COMMIT_SHA|g" service.yaml
        sed -i "s|FRONTEND_IMAGE|us-central1-docker.pkg.dev/$PROJECT_ID/grant-repo/frontend:$COMMIT_SHA|g" service.yaml
        gcloud run services replace service.yaml --region us-east1

options:
  logging: CLOUD_LOGGING_ONLY